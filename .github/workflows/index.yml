name: Index

# After every merge to main: regenerate INDEX_MAP.md (the generated half of the repo index agents read first) and
# commit it if anything changed. PRs are already held to a current map by ci.yml; this catches direct pushes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate INDEX_MAP.md
        run: python3 tools/gen_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- INDEX_MAP.md; then
            echo "INDEX_MAP.md already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX_MAP.md
          git commit -m "Regenerate INDEX_MAP.md [skip ci]"
          git push
